name: Runtime migration

on:
  push:
    branches: [portfolio-improvements-2026-08]
    paths:
      - .github/workflows/runtime-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: portfolio-improvements-2026-08
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply guarded runtime migration
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const eslintPath = '.eslintrc.js';
          let eslint = fs.readFileSync(eslintPath, 'utf8');
          const rulesNeedle = "    'react/react-in-jsx-scope': 'off',";
          if (!eslint.includes(rulesNeedle)) throw new Error('Expected ESLint rule anchor not found');
          eslint = eslint.replace(
            rulesNeedle,
            [
              rulesNeedle,
              "    'react/no-unknown-property': ['error', { ignore: ['jsx', 'global'] }],",
              "    '@typescript-eslint/no-unused-vars': ['error', { caughtErrors: 'none' }],",
              "    '@typescript-eslint/no-unused-expressions': ['error', { allowShortCircuit: true }],"
            ].join('\n')
          );
          const envNeedle = "  env: {";
          if (!eslint.includes(envNeedle)) throw new Error('Expected ESLint env anchor not found');
          eslint = eslint.replace(
            envNeedle,
            "  settings: { react: { version: 'detect' } },\n  env: {"
          );
          fs.writeFileSync(eslintPath, eslint);

          const recordPath = 'components/record-page.tsx';
          let record = fs.readFileSync(recordPath, 'utf8');
          const badTypeof = "typeof window !== undefined && window.AudioContext || window.webkitAudioContext";
          if (!record.includes(badTypeof)) throw new Error('Expected typeof guard not found');
          record = record.replace(
            badTypeof,
            "typeof window !== 'undefined' && (window.AudioContext || window.webkitAudioContext)"
          );
          fs.writeFileSync(recordPath, record);

          const indexPath = 'pages/index.tsx';
          let index = fs.readFileSync(indexPath, 'utf8');
          const labelNeedle = '<label htmlFor="file-input">';
          if (!index.includes(labelNeedle)) throw new Error('Expected upload label not found');
          index = index.replace(labelNeedle, '<label htmlFor="file-input" aria-label="Upload a video file">');
          fs.writeFileSync(indexPath, index);

          const babelPath = '.babelrc';
          const babel = fs.readFileSync(babelPath, 'utf8');
          if (!/"next\/babel"/.test(babel)) throw new Error('Unexpected Babel configuration; refusing automatic removal');
          fs.unlinkSync(babelPath);

          const pkgPath = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
          pkg.resolutions = {
            ...(pkg.resolutions || {}),
            postcss: '8.5.23',
            jws: '4.0.1'
          };
          fs.writeFileSync(pkgPath, `${JSON.stringify(pkg, null, 2)}\n`);

          const testPath = 'tests/runtime-modernization.test.mjs';
          let test = fs.readFileSync(testPath, 'utf8');
          const testNeedle = "  assert.equal(pkg.dependencies.got, undefined);\n});";
          if (!test.includes(testNeedle)) throw new Error('Expected runtime modernization test anchor not found');
          test = test.replace(
            testNeedle,
            "  assert.equal(pkg.dependencies.got, undefined);\n  assert.equal(pkg.resolutions?.postcss, '8.5.23');\n  assert.equal(pkg.resolutions?.jws, '4.0.1');\n});"
          );
          fs.writeFileSync(testPath, test);
          NODE
      - name: Resolve maintained dependency graph
        run: yarn install --ignore-scripts --non-interactive
      - name: Regression contracts
        run: node --test tests/*.test.mjs
      - name: TypeScript
        run: yarn tsc --noEmit
      - name: Production build
        run: yarn build
      - name: Production dependency audit
        run: node scripts/check-production-audit.mjs
      - name: Commit verified migration
        run: |
          git config user.name 'Egor Denisov'
          git config user.email 'designer.egor@ya.ru'
          git add -A .babelrc .eslintrc.js components/record-page.tsx pages/index.tsx package.json tests/runtime-modernization.test.mjs yarn.lock
          if git diff --cached --quiet; then
            echo 'No migration changes to commit'
            exit 0
          fi
          git commit -m 'build: complete verified stream runtime migration'
          git push origin HEAD:portfolio-improvements-2026-08
